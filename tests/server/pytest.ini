# Server regression tests: run with `python3 -m pytest tests/server` against a running ragon-serve
# (RAGON_SERVE_URL=http://127.0.0.1:8300). Without a reachable ragon-serve every test skips.
[pytest]
testpaths = .
python_files = test_*.py
markers =
    slow: sends a prompt of several thousand tokens or generates for several seconds
